name: Telegram Command Listener

# Long-polls Telegram getUpdates so slash commands get answered live.
#
# MANUAL ONLY. The old schedule relayed listeners 6:00 AM–11:30 PM IST every
# day, which billed ~860 Actions minutes/day (~26,000/month) — the 3,000
# minute plan ran out in the first days of each month and GitHub then
# blocked EVERY job, including the scheduled market reports. Any always-on
# listener on GitHub Actions costs more than the plan, even market hours
# only (~8,500 min/month). Start it by hand (Actions → Run workflow) for a
# short window, or move commands to a Telegram webhook on a free host.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to listen (minutes)"
        required: false
        default: "15"

# Exactly one listener may poll at a time (two would steal each other's
# updates). cancel-in-progress is OFF on purpose: backups QUEUE behind the
# active listener instead of killing it. When the active one exits at market
# close, the queued backup starts, sees the market is closed, and exits in
# seconds (bot.py computes the remaining window).
concurrency:
  group: telegram-listener
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 75    # hard cap so a typo'd "minutes" can't burn hours
    permissions:
      contents: write   # /setstrategy commits data/config.json back to main

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Listen for commands
        env:
          PYTHONUNBUFFERED: "1"   # stream log lines live instead of at exit
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          GNEWS_API_KEY:      ${{ secrets.GNEWS_API_KEY }}
          RUN_TYPE: listen
          # Manual dispatch passes the window length (default 15 min).
          LISTEN_MINUTES: ${{ github.event.inputs.minutes || '15' }}
          # No STRATEGY here — the listener resolves data/config.json
          # (/setstrategy) → ACTIVE_STRATEGY_VAR → adaptive, live per command.
          ACTIVE_STRATEGY_VAR: ${{ vars.ACTIVE_STRATEGY || '' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: python bot.py
