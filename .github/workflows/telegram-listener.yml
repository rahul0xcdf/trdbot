name: Telegram Command Listener

# Long-polls Telegram getUpdates so slash commands get answered live.
#
# MANUAL ONLY — there is no cron here on purpose. This used to relay 5h45m
# runs back to back from 6 AM to 11:30 PM IST, which kept a runner busy almost
# all day; GitHub then deprioritised this repo's scheduled workflows, and the
# market reports in market-bot.yml started arriving hours late or not at all.
# Run it from the Actions tab ("Run workflow") when you actually want to use
# the slash commands, and give it a window in minutes.
on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to listen (minutes)"
        required: false
        default: "15"

# Exactly one listener may poll at a time — two would steal each other's
# updates. A second dispatch queues behind the running one rather than
# killing it.
concurrency:
  group: telegram-listener
  cancel-in-progress: false

jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 355   # GitHub-hosted job hard limit is 6 h
    permissions:
      contents: write   # /setstrategy commits data/config.json back to main

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Listen for commands
        env:
          PYTHONUNBUFFERED: "1"   # stream log lines live instead of at exit
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          GNEWS_API_KEY:      ${{ secrets.GNEWS_API_KEY }}
          RUN_TYPE: listen
          # Manual dispatch always passes a window (default 15 min); left
          # empty, bot.py would listen until 11:30 PM IST.
          LISTEN_MINUTES: ${{ github.event.inputs.minutes || '' }}
          # No STRATEGY here — the listener resolves data/config.json
          # (/setstrategy) → ACTIVE_STRATEGY_VAR → adaptive, live per command.
          ACTIVE_STRATEGY_VAR: ${{ vars.ACTIVE_STRATEGY || '' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-2.5-flash' }}
        run: python bot.py
