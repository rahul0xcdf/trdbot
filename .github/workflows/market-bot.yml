name: Market Intelligence Bot

# Shows which report each run sent in the Actions list.
run-name: "${{ inputs.run_type || 'premarket' }} (${{ inputs.trigger || 'manual' }})"

# ── When it runs ──────────────────────────────────────────────────────────────
# Started ON THE MINUTE by the timer chain (chain.py + timer.yml, all inside
# GitHub): each report books the next one, so they land at 8:15 AM, 2:00 PM
# and 6:00 PM IST, Mon–Fri, on NSE trading days. watchdog.yml restarts the
# chain if it ever breaks. There is deliberately NO `schedule:` block here —
# GitHub's own cron started this bot 2.5–7 HOURS late.
# Chain runs still skip weekends, holidays and anything outside 7 AM–7 PM.
on:
  workflow_dispatch:
    inputs:
      run_type:
        description: "Which report to send"
        required: false
        default: "premarket"
        type: choice
        options:
          - premarket
          - afternoon
          - evening
      trigger:
        description: "Who started it (chain = the timer chain; leave on manual)"
        required: false
        default: "manual"
        type: choice
        options:
          - manual
          - chain
      send_at:
        description: "Chain only: exact send time (epoch seconds)"
        required: false
        default: ""
        type: string
      model:
        description: "Gemini model"
        required: false
        default: "gemini-2.5-flash"
        type: string

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write   # evening commits data/signals.db back for history
      actions: write    # chain runs book the next report (workflow_dispatch)

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve RUN_TYPE
        run: |
          RUN_TYPE="${{ inputs.run_type || 'premarket' }}"
          echo "RUN_TYPE=$RUN_TYPE" >> "$GITHUB_ENV"
          echo "Resolved RUN_TYPE=$RUN_TYPE (trigger: ${{ inputs.trigger || 'manual' }})"

      - name: Run Market Bot
        env:
          PYTHONUNBUFFERED: "1"   # stream log lines live instead of at exit
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          # Friends' chat IDs, comma-separated (optional; reports only).
          TELEGRAM_SHARE_CHAT_IDS: ${{ secrets.TELEGRAM_SHARE_CHAT_IDS }}
          GNEWS_API_KEY:       ${{ secrets.GNEWS_API_KEY }}
          RUN_TYPE:            ${{ env.RUN_TYPE }}
          TRIGGER:             ${{ inputs.trigger || 'manual' }}
          SEND_AT:             ${{ inputs.send_at }}
          GITHUB_TOKEN:        ${{ secrets.GITHUB_TOKEN }}
          GEMINI_MODEL: >-
            ${{
              github.event.inputs.model ||
              vars.GEMINI_MODEL ||
              'gemini-2.5-flash'
            }}
        run: python bot.py

      # ── Persist the daily PCR / VIX / FII-DII snapshot back to the repo ─────
      #    The runner is ephemeral: without this, data/signals.db history is
      #    lost when the job exits.
      - name: Persist data (daily snapshot history)
        if: env.RUN_TYPE == 'evening'
        run: |
          git config user.name "market-bot[actions]"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/signals.db 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data changes to persist"
          else
            git commit -m "chore: persist ${RUN_TYPE} data ($(date -u +%F))"
            git pull --rebase origin main || true
            git push origin HEAD:main || echo "[WARN] data push failed (non-fatal)"
          fi

      # ── On failure — notify Telegram ───────────────────────────────────────
      - name: Notify on failure
        if: failure()
        run: |
          # -o /dev/null: Telegram's reply contains your name/username —
          # keep it out of the (public) log.
          curl -s -o /dev/null -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="⚠️ Market Bot failed (RUN_TYPE=${{ env.RUN_TYPE }}). Check: ${{ github.server_url }}/${{ github.repository }}/actions" \
            -d parse_mode="HTML"
