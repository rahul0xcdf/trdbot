name: Market Intelligence Bot

# ── Why this ticks instead of using one cron per report ───────────────────────
# GitHub's cron is best-effort, and on this repo it has been badly so: fires
# land 20–80 min late and whole mornings get dropped (2026-09-02: nothing fired
# between 02:33 and 07:14 UTC, so the 8:15 AM pre-market report went out at
# 12:44 PM IST). Scheduling each report on its own cron cannot survive that.
#
# So: one cron ticks every 15 min and modules/schedule.py says what is due.
#   • fired early → the job sleeps until the exact IST target time
#   • fired late  → it still sends, while inside that slot's grace window
#   • past the grace → nothing is sent (a "mid-morning" note at 4 PM is worse
#     than no note), and the next tick picks up the next slot
# A cache marker per slot+day stops a burst of delayed ticks re-sending a slot.
on:
  schedule:
    # Every 15 min, 02:02–11:47 UTC (07:32–17:17 IST), Mon–Fri. Off the top of
    # the hour on purpose — that is when GitHub's scheduler is most congested.
    - cron: "2,17,32,47 2-11 * * 1-5"

  # ── Manual trigger (runs the chosen flow immediately, no schedule gate) ─────
  workflow_dispatch:
    inputs:
      run_type:
        description: "Which flow to run"
        required: false
        default: "premarket"
        type: choice
        options:
          - premarket
          - opening
          - midmorning
          - european_open
          - london_us
          - exit_reminder
          - eod
          - vix_check
      strategy:
        description: "Strategy (configured = whatever /setstrategy or ACTIVE_STRATEGY says)"
        required: false
        default: "configured"
        type: choice
        options:
          - configured
          - adaptive
          - nifty_intraday
          - balanced
          - momentum
          - conservative
          - sentiment_first
      model:
        description: "Gemini model"
        required: false
        default: "gemini-2.5-flash"
        type: string

# Ticks run one at a time: when GitHub delivers several delayed fires at once,
# each waits for the one ahead of it and so sees an up-to-date "already sent"
# marker instead of double-posting.
concurrency:
  group: market-bot
  cancel-in-progress: false

jobs:
  # Cheap gate (~20 s, no dependencies) — most ticks stop here.
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      due:          ${{ steps.gate.outputs.due }}
      run_type:     ${{ steps.gate.outputs.run_type }}
      target_epoch: ${{ steps.gate.outputs.target_epoch }}
      marker:       ${{ steps.gate.outputs.marker }}
      already_sent: ${{ steps.sent.outputs.cache-hit }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: What is due right now?
        id: gate
        env:
          RUN_TYPE_INPUT: ${{ github.event.inputs.run_type }}
        run: python3 -m modules.schedule

      - name: Has this slot already gone out?
        id: sent
        if: steps.gate.outputs.due == 'true' && steps.gate.outputs.marker != ''
        uses: actions/cache/restore@v4
        with:
          path: .slot-marker
          key: sent-${{ steps.gate.outputs.marker }}
          lookup-only: true

  run-bot:
    needs: decide
    if: needs.decide.outputs.due == 'true' && needs.decide.outputs.already_sent != 'true'
    runs-on: ubuntu-latest
    # Room for the wait-for-target sleep (≤18 min) plus the flow itself.
    timeout-minutes: 35
    permissions:
      contents: write   # premarket/eod commit data/ back for persistence
    env:
      RUN_TYPE: ${{ needs.decide.outputs.run_type }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Market Bot
        env:
          PYTHONUNBUFFERED: "1"   # stream log lines live instead of at exit
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          GNEWS_API_KEY:       ${{ secrets.GNEWS_API_KEY }}
          RUN_TYPE:            ${{ env.RUN_TYPE }}
          # The IST moment this message is for — bot.py sleeps out any head
          # start so an early runner does not send early. Empty on manual runs.
          RUN_AT_EPOCH:        ${{ needs.decide.outputs.target_epoch }}
          # Precedence lives in modules/config.py: explicit STRATEGY input →
          # data/config.json (/setstrategy) → ACTIVE_STRATEGY_VAR → adaptive.
          # "configured" is not a real strategy, so it falls through to config.
          STRATEGY: ${{ github.event.inputs.strategy || '' }}
          ACTIVE_STRATEGY_VAR: ${{ vars.ACTIVE_STRATEGY || '' }}
          GEMINI_MODEL: >-
            ${{
              github.event.inputs.model ||
              vars.GEMINI_MODEL ||
              'gemini-2.5-flash'
            }}
        run: python bot.py

      # ── Remember this slot went out, so later delayed ticks skip it ─────────
      - name: Write the sent marker
        if: success() && needs.decide.outputs.marker != ''
        run: date -u +%FT%TZ > .slot-marker

      - name: Save the sent marker
        if: success() && needs.decide.outputs.marker != ''
        continue-on-error: true   # a racing tick may have saved it already
        uses: actions/cache/save@v4
        with:
          path: .slot-marker
          key: sent-${{ needs.decide.outputs.marker }}

      # ── Persist generated data back to the repo ─────────────────────────────
      #    The runner is ephemeral: without this, the premarket report cache
      #    (served by the command listener) and the signal history DB (used by
      #    backtest.py) are lost when the job exits.
      - name: Persist data (report + signal history)
        if: env.RUN_TYPE == 'premarket' || env.RUN_TYPE == 'eod'
        run: |
          git config user.name "market-bot[actions]"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/premarket_report.json data/signals.db 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data changes to persist"
          else
            git commit -m "chore: persist ${RUN_TYPE} data ($(date -u +%F))"
            git pull --rebase origin main || true
            git push origin HEAD:main || echo "[WARN] data push failed (non-fatal)"
          fi

      # ── On failure — notify Telegram (skip for silent vix_check noise) ─────
      - name: Notify on failure
        if: failure() && env.RUN_TYPE != 'vix_check'
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="⚠️ Market Bot failed (RUN_TYPE=${{ env.RUN_TYPE }}). Check: ${{ github.server_url }}/${{ github.repository }}/actions" \
            -d parse_mode="HTML"
