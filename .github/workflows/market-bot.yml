name: Market Intelligence Bot

on:
  # ── Scheduled runs (all cron in UTC; comments show IST) — Mon–Fri ──────────
  # GitHub cron is best-effort: this repo's runs have landed 2.5–7 HOURS
  # late. bot.py skips any scheduled run that starts outside its window
  # (premarket 6:30–9:15, afternoon 1:30–3:30, evening 5:30–9:30 PM), so a
  # late run never sends a stale report. For on-time delivery, trigger the
  # workflow_dispatch below from an outside scheduler instead.
  schedule:
    - cron: "33 2 * * 1-5"      # target 8:15 AM IST → premarket
    - cron: "23 8 * * 1-5"      # target 2:00 PM IST → afternoon
    - cron: "23 12 * * 1-5"     # target 6:00 PM IST → evening

  # ── Manual trigger (testing, or an outside scheduler hitting the API) ─────
  workflow_dispatch:
    inputs:
      run_type:
        description: "Which report to send"
        required: false
        default: "premarket"
        type: choice
        options:
          - premarket
          - afternoon
          - evening
      model:
        description: "Gemini model"
        required: false
        default: "gemini-2.5-flash"
        type: string

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # evening commits data/signals.db back for history

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # ── Map the firing cron → RUN_TYPE (or use the manual input) ───────────
      #    github.event.schedule holds the exact cron string that fired.
      - name: Resolve RUN_TYPE
        run: |
          if [ -n "${{ github.event.inputs.run_type }}" ]; then
            RUN_TYPE="${{ github.event.inputs.run_type }}"
          else
            case "${{ github.event.schedule }}" in
              "33 2 * * 1-5")   RUN_TYPE=premarket ;;
              "23 8 * * 1-5")   RUN_TYPE=afternoon ;;
              "23 12 * * 1-5")  RUN_TYPE=evening ;;
              *)                RUN_TYPE=premarket ;;
            esac
          fi
          echo "RUN_TYPE=$RUN_TYPE" >> "$GITHUB_ENV"
          echo "Resolved RUN_TYPE=$RUN_TYPE"

      - name: Run Market Bot
        env:
          PYTHONUNBUFFERED: "1"   # stream log lines live instead of at exit
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN:  ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:    ${{ secrets.TELEGRAM_CHAT_ID }}
          GNEWS_API_KEY:       ${{ secrets.GNEWS_API_KEY }}
          RUN_TYPE:            ${{ env.RUN_TYPE }}
          GEMINI_MODEL: >-
            ${{
              github.event.inputs.model ||
              vars.GEMINI_MODEL ||
              'gemini-2.5-flash'
            }}
        run: python bot.py

      # ── Persist the daily PCR / VIX / FII-DII snapshot back to the repo ─────
      #    The runner is ephemeral: without this, data/signals.db history is
      #    lost when the job exits.
      - name: Persist data (daily snapshot history)
        if: env.RUN_TYPE == 'evening'
        run: |
          git config user.name "market-bot[actions]"
          git config user.email "actions@users.noreply.github.com"
          git add -f data/signals.db 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No data changes to persist"
          else
            git commit -m "chore: persist ${RUN_TYPE} data ($(date -u +%F))"
            git pull --rebase origin main || true
            git push origin HEAD:main || echo "[WARN] data push failed (non-fatal)"
          fi

      # ── On failure — notify Telegram ───────────────────────────────────────
      - name: Notify on failure
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d text="⚠️ Market Bot failed (RUN_TYPE=${{ env.RUN_TYPE }}). Check: ${{ github.server_url }}/${{ github.repository }}/actions" \
            -d parse_mode="HTML"
